<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="shortcut icon" type="image/png" href="images/cherry_icon.png">
  <link id="favicon" rel="shortcut icon" href="images/cherry_icon.png" sizes="16x16 32x32 48x48" type="image/png"/>
  <link rel="icon" href="images/cherry_icon.png" sizes="256x256" type="image/png"/>
  <link rel="apple-touch-icon-precomposed" sizes="152x152" href="images/cherry_icon.png"/>
  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="images/cherry_icon.png"/>
  <link rel="apple-touch-icon-precomposed" sizes="120x120" href="images/cherry_icon.png"/>
  <link rel="apple-touch-icon-precomposed" sizes="114x114" href="images/cherry_icon.png"/>
  <link rel="apple-touch-icon-precomposed" sizes="72x72" href="images/cherry_icon.png"/>
  <link rel="apple-touch-icon-precomposed" href="images/cherry_icon.png"/>
  <meta name="msapplication-TileImage" content="images/cherry_icon.png"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #fff0a1;
      color: #15213f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 64px;
      gap: 40px;
    }

    .noise-player {
      width: 100%;
      max-width: 620px;
    }
    .noise-player audio {
      width: 100%;
      height: 36px;
    }

    /* ── Digital clock ── */
    .clock {
      font-family: 'VT323', monospace;
      font-size: 11rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      color: #15213f;
      font-variant-numeric: tabular-nums;
      image-rendering: pixelated;
    }

    /* ── Tasks section ── */
    .tasks-section {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tasks-section h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #15213f;
      opacity: 0.5;
      margin-bottom: 4px;
    }

    #tasks-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-row {
      background: rgba(255,255,255,0.45);
      border: 1px solid rgba(21,33,63,0.3);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .task-row.running {
      border-style: solid;
      border-color: #4caf50;
      border-width: 2px;
      box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.3);
    }
    .task-row.selected {
      background: rgba(255,255,255,0.75);
      border-color: rgba(21,33,63,0.55);
      box-shadow: 0 0 0 3px rgba(21,33,63,0.18);
    }
    .task-row.done {
      opacity: 0.45;
    }

    .done-badge {
      display: flex;
      align-items: center;
      color: #4caf50;
      flex-shrink: 0;
    }
    .done-badge svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .task-row.selected.running {
      box-shadow: 0 0 0 3px rgba(21,33,63,0.35);
    }

    .task-name {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(21,33,63,0.3);
      color: #15213f;
      font-size: 0.95rem;
      padding: 4px 6px;
      outline: none;
      min-width: 0;
      transition: border-color 0.2s;
    }
    .task-name:focus {
      border-bottom-color: rgba(21,33,63,0.6);
      border-bottom-width: 2px;
    }
    .task-name.locked {
      border-bottom-color: transparent;
      cursor: default;
    }
    .task-name.locked:hover {
      border-bottom-color: rgba(21,33,63,0.3);
    }

    .task-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      min-width: 72px;
    }

    .task-timer {
      font-size: 1rem;
      font-variant-numeric: tabular-nums;
      color: #15213f;
      opacity: 0.6;
      text-align: right;
    }
    .task-row.running .task-timer {
      opacity: 1;
      font-weight: 600;
    }

    .task-total {
      font-size: 0.7rem;
      font-variant-numeric: tabular-nums;
      color: #15213f;
      opacity: 0.35;
      text-align: right;
      margin-top: 2px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      color: #15213f;
      opacity: 0.5;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, opacity 0.15s;
      flex-shrink: 0;
    }
    .icon-btn:hover { background: rgba(21,33,63,0.1); opacity: 1; }
    .icon-btn:disabled { opacity: 0.2; cursor: default; pointer-events: none; }
    .icon-btn svg { width: 18px; height: 18px; display: block; }
    .icon-btn.delete.pending { color: #d32f2f; opacity: 1; background: rgba(211,47,47,0.1); }

    .add-task-btn {
      position: absolute;
      right: 0;
      background: none;
      border: 1px dashed #15213f;
      border-radius: 8px;
      color: #15213f;
      font-size: 0.85rem;
      padding: 8px 20px;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.15s, background 0.15s;
    }
    .add-task-btn:hover {
      background: rgba(21,33,63,0.08);
      opacity: 1;
    }

    .tasks-footer {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 14px;
    }
    .tasks-footer-name-col {
      flex: 1;
      min-width: 0;
    }
    .tasks-footer-total {
      min-width: 72px;
      font-size: 1rem;
      font-variant-numeric: tabular-nums;
      color: #15213f;
      opacity: 0.35;
      text-align: right;
    }
    .tasks-footer-spacer {
      width: 30px;
      flex-shrink: 0;
    }

    /* ── Blur / focus overlay ── */
    body.unfocused > *:not(#clock-area) {
      visibility: hidden;
    }
    body.unfocused {
      background: #000 !important;
    }
    body.unfocused #clock {
      color: #fff0a1;
    }

    #clock-area {
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    #clock-area .clock,
    #running-task-display {
      text-align: right;
    }

    #running-task-display {
      display: none;
      font-family: 'VT323', monospace;
      font-size: clamp(1.2rem, 4vw, 2rem);
      color: #fff0a1;
      letter-spacing: 0.05em;
      text-align: right;
    }
  </style>
</head>
<body>

  <!-- White noise -->
  <div class="noise-player">
    <audio controls loop><source src="./white-noise.wav" type="audio/x-wav" /></audio>
  </div>

  <!-- Digital clock -->
  <div id="clock-area">
    <div class="clock" id="clock">00:00:00</div>
    <div id="running-task-display"></div>
  </div>

  <!-- Tasks -->
  <section class="tasks-section">
    <h2></h2>
    <div id="tasks-container"></div>
    <div class="tasks-footer">
      <div class="tasks-footer-name-col"></div>
      <span class="tasks-footer-total" id="tasks-total-time"></span>
      <span class="tasks-footer-spacer"></span>
      <span class="tasks-footer-spacer"></span>
      <span class="tasks-footer-spacer"></span>
      <button class="add-task-btn" id="add-task-btn">+</button>
    </div>
  </section>

  <script>
    /* ── Clock ── */
    function updateRunningTaskDisplay() {
      const el = document.getElementById('running-task-display');
      if (!el) return;
      let running;
      try { running = tasks.find(t => t.running); } catch { return; }
      const unfocused = document.body.classList.contains('unfocused');
      if (unfocused && running) {
        el.textContent = formatTime(getTodayElapsed(running));
        el.style.display = 'block';
      } else {
        el.style.display = 'none';
      }
    }

    function updateClock() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('clock').textContent =
        `${pad(now.getHours())}:${pad(now.getMinutes())}`;
      updateRunningTaskDisplay();
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* ── Focus tracking ── */
    function applyFocusState() {
      document.body.classList.toggle('unfocused', !document.hasFocus());
      updateRunningTaskDisplay();
    }
    window.addEventListener('blur', () => setTimeout(applyFocusState, 0));
    window.addEventListener('focus', applyFocusState);
    document.addEventListener('visibilitychange', applyFocusState);
    applyFocusState();

    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    /* ── Storage ── */
    const STORAGE_KEY = 'focus_tasks_v2';

    /*
      Task shape:
        id, name,
        todayDate    — "YYYY-MM-DD" the day todayElapsed belongs to
        todayElapsed — seconds measured on todayDate
        totalElapsed — cumulative seconds across all days
        running, startedAt
    */
    function migrate(raw) {
      // migrate from v1 format (had 'elapsed' instead of today/total)
      if (raw.elapsed !== undefined && raw.totalElapsed === undefined) {
        raw.totalElapsed = raw.elapsed;
        raw.todayDate    = todayStr();
        raw.todayElapsed = raw.elapsed;
        delete raw.elapsed;
      }
      if (raw.todayDate    === undefined) raw.todayDate    = todayStr();
      if (raw.todayElapsed === undefined) raw.todayElapsed = 0;
      if (raw.totalElapsed === undefined) raw.totalElapsed = 0;
      if (raw.done         === undefined) raw.done         = false;
      return raw;
    }

    function loadTasks() {
      // try v2, then v1
      try {
        const v2 = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (v2) return v2.map(migrate);
      } catch {}
      try {
        const v1 = JSON.parse(localStorage.getItem('focus_tasks_v1'));
        if (v1) return v1.map(migrate);
      } catch {}
      return [];
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    let tasks = loadTasks();
    if (tasks.length === 0) tasks = [newTaskData()];

    const intervals = {};

    function newTaskData(name = '') {
      return {
        id: Date.now() + Math.random(),
        name,
        todayDate: todayStr(),
        todayElapsed: 0,
        totalElapsed: 0,
        running: false,
        startedAt: null,
        done: false,
      };
    }

    /* ── Time helpers ── */
    function formatTime(seconds) {
      seconds = Math.max(0, Math.floor(seconds));
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      const pad = n => String(n).padStart(2, '0');
      return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
    }

    function runningDelta(task) {
      return (task.running && task.startedAt) ? Math.floor((Date.now() - task.startedAt) / 1000) : 0;
    }

    function getTodayElapsed(task) {
      return task.todayElapsed + runningDelta(task);
    }

    function getTotalElapsed(task) {
      return task.totalElapsed + runningDelta(task);
    }

    // SVG icons
    const ICON_PLAY   = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
    const ICON_STOP   = `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>`;
    const ICON_DELETE = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19a2 2 0 002 2h8a2 2 0 002-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`;
    const ICON_DONE   = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`;

    /* ── Keyboard navigation ── */
    let selectedTaskIndex = -1;

    function setSelectedTask(index) {
      if (tasks.length === 0) { selectedTaskIndex = -1; return; }
      selectedTaskIndex = Math.max(0, Math.min(index, tasks.length - 1));
      updateSelectionHighlight();
    }

    function updateSelectionHighlight() {
      document.querySelectorAll('#tasks-container .task-row').forEach((row, i) => {
        row.classList.toggle('selected', i === selectedTaskIndex);
      });
    }

    document.addEventListener('keydown', e => {
      const active = document.activeElement;
      const inInput = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
      if (inInput) return;

      if (e.key === 'ArrowDown' && e.shiftKey) {
        e.preventDefault();
        if (selectedTaskIndex >= 0 && selectedTaskIndex < tasks.length - 1 && !tasks[selectedTaskIndex].done) {
          const nextTask = tasks[selectedTaskIndex + 1];
          if (!nextTask.done) {
            [tasks[selectedTaskIndex], tasks[selectedTaskIndex + 1]] = [tasks[selectedTaskIndex + 1], tasks[selectedTaskIndex]];
            selectedTaskIndex += 1;
            saveTasks();
            renderTasks();
          }
        }
      } else if (e.key === 'ArrowUp' && e.shiftKey) {
        e.preventDefault();
        if (selectedTaskIndex > 0 && selectedTaskIndex < tasks.length && !tasks[selectedTaskIndex].done) {
          [tasks[selectedTaskIndex], tasks[selectedTaskIndex - 1]] = [tasks[selectedTaskIndex - 1], tasks[selectedTaskIndex]];
          selectedTaskIndex -= 1;
          saveTasks();
          renderTasks();
        }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        setSelectedTask(selectedTaskIndex === -1 ? 0 : selectedTaskIndex + 1);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        setSelectedTask(selectedTaskIndex === -1 ? tasks.length - 1 : selectedTaskIndex - 1);
      } else if (e.key === ' ') {
        e.preventDefault();
        if (selectedTaskIndex >= 0 && selectedTaskIndex < tasks.length) {
          const task = tasks[selectedTaskIndex];
          if (task.running) stopTask(task.id); else startTask(task.id);
        }
      } else if (e.key === 'p') {
        e.preventDefault();
        const audio = document.querySelector('.noise-player audio');
        if (audio) audio.paused ? audio.play() : audio.pause();
      } else if (e.key === 'n') {
        e.preventDefault();
        document.getElementById('add-task-btn').click();
      } else if (e.key === 'd') {
        e.preventDefault();
        if (selectedTaskIndex >= 0 && selectedTaskIndex < tasks.length) {
          const rows = document.querySelectorAll('#tasks-container .task-row');
          rows[selectedTaskIndex]?.querySelector('.icon-btn.delete')?.click();
        }
      } else if (e.key === 'Enter') {
        if (selectedTaskIndex >= 0 && selectedTaskIndex < tasks.length) {
          const rows = document.querySelectorAll('#tasks-container .task-row');
          const nameEl = rows[selectedTaskIndex]?.querySelector('.task-name');
          if (nameEl) {
            nameEl.readOnly = false;
            nameEl.classList.remove('locked');
            nameEl.focus();
            nameEl.select();
          }
        }
      } else if (e.key === 'c') {
        e.preventDefault();
        if (selectedTaskIndex >= 0 && selectedTaskIndex < tasks.length) {
          const task = tasks[selectedTaskIndex];
          if (task.running) stopTask(task.id);
          const wasDone = task.done;
          task.done = !wasDone;

          if (!wasDone) {
            // Sink down until only done tasks are below
            let idx = selectedTaskIndex;
            while (idx < tasks.length - 1 && !tasks[idx + 1].done) {
              [tasks[idx], tasks[idx + 1]] = [tasks[idx + 1], tasks[idx]];
              idx++;
            }
            selectedTaskIndex = idx;
          }

          saveTasks();
          renderTasks();
        }
      }
    });

    /* ── Render ── */
    function renderTasks() {
      const container = document.getElementById('tasks-container');
      container.innerHTML = '';
      tasks.forEach((task, i) => {
        const row = document.createElement('div');
        row.className = 'task-row' + (task.running ? ' running' : '') + (task.done ? ' done' : '') + (i === selectedTaskIndex ? ' selected' : '');
        row.dataset.id = task.id;
        row.addEventListener('click', () => { selectedTaskIndex = i; updateSelectionHighlight(); });

        /* Name input */
        const nameEl = document.createElement('input');
        nameEl.type = 'text';
        nameEl.className = 'task-name' + (task.name ? ' locked' : '');
        nameEl.value = task.name;
        nameEl.placeholder = '';
        nameEl.readOnly = !!task.name;

        const lockName = () => {
          task.name = nameEl.value.trim();
          if (task.name) { nameEl.readOnly = true; nameEl.classList.add('locked'); }
          saveTasks();
        };
        nameEl.addEventListener('blur', lockName);
        nameEl.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === 'Escape') { e.stopPropagation(); nameEl.blur(); } });
        nameEl.addEventListener('dblclick', () => {
          nameEl.readOnly = false;
          nameEl.classList.remove('locked');
          nameEl.focus(); nameEl.select();
        });

        /* Right-side column: today timer + total */
        const rightEl = document.createElement('div');
        rightEl.className = 'task-right';

        const timerEl = document.createElement('span');
        timerEl.className = 'task-timer';
        timerEl.textContent = formatTime(getTodayElapsed(task));

        const totalEl = document.createElement('span');
        totalEl.className = 'task-total';
        const total = getTotalElapsed(task);
        const today = getTodayElapsed(task);
        totalEl.textContent = total > today ? `Σ ${formatTime(total)}` : '';

        rightEl.append(timerEl, totalEl);

        /* Buttons */
        const startBtn = document.createElement('button');
        startBtn.className = 'icon-btn start';
        startBtn.innerHTML = ICON_PLAY;
        startBtn.title = 'Start';
        startBtn.disabled = task.running || task.done;
        startBtn.addEventListener('click', () => startTask(task.id));

        const stopBtn = document.createElement('button');
        stopBtn.className = 'icon-btn stop';
        stopBtn.innerHTML = ICON_STOP;
        stopBtn.title = 'Stop';
        stopBtn.disabled = !task.running;
        stopBtn.addEventListener('click', () => stopTask(task.id));

        const delBtn = document.createElement('button');
        delBtn.className = 'icon-btn delete';
        delBtn.innerHTML = ICON_DELETE;
        delBtn.title = 'Usuń zadanie';
        delBtn.addEventListener('click', () => {
          if (delBtn.dataset.pending) {
            clearTimeout(Number(delBtn.dataset.pending));
            delete delBtn.dataset.pending;
            delBtn.classList.remove('pending');
            deleteTask(task.id);
          } else {
            delBtn.classList.add('pending');
            const timer = setTimeout(() => {
              delBtn.classList.remove('pending');
              delete delBtn.dataset.pending;
            }, 3000);
            delBtn.dataset.pending = timer;
          }
        });

        row.append(nameEl, rightEl, startBtn, stopBtn, delBtn);
        if (task.done) {
          const doneBadge = document.createElement('span');
          doneBadge.className = 'done-badge';
          doneBadge.innerHTML = ICON_DONE;
          doneBadge.title = 'Done';
          row.insertBefore(doneBadge, rightEl);
        }
        container.appendChild(row);

        if (task.running) attachLiveUpdate(task.id, timerEl, totalEl);
      });
      updateTotalTime();
    }

    function attachLiveUpdate(id, timerEl, totalEl) {
      if (intervals[id]) clearInterval(intervals[id]);
      intervals[id] = setInterval(() => {
        const task = tasks.find(t => t.id == id);
        if (!task) { clearInterval(intervals[id]); return; }
        timerEl.textContent = formatTime(getTodayElapsed(task));
        const total = getTotalElapsed(task);
        const today = getTodayElapsed(task);
        totalEl.textContent = total > today ? `Σ ${formatTime(total)}` : '';
        updateTotalTime();
      }, 1000);
    }

    /* ── Actions ── */
    function updateTotalTime() {
      const el = document.getElementById('tasks-total-time');
      if (!el) return;
      const total = tasks.reduce((sum, t) => sum + getTodayElapsed(t), 0);
      el.textContent = total > 0 ? formatTime(total) : '';
    }

    function startTask(id) {
      const task = tasks.find(t => t.id == id);
      if (!task || task.running || task.done) return;
      tasks.forEach(t => { if (t.running) stopTask(t.id); });

      // new day? reset today counter
      const today = todayStr();
      if (task.todayDate !== today) {
        task.todayDate    = today;
        task.todayElapsed = 0;
      }

      task.running   = true;
      task.startedAt = Date.now();
      saveTasks();
      renderTasks();
      updateRunningTaskDisplay();
    }

    function stopTask(id) {
      const task = tasks.find(t => t.id == id);
      if (!task || !task.running) return;
      const delta = Math.floor((Date.now() - task.startedAt) / 1000);
      task.todayElapsed += delta;
      task.totalElapsed += delta;
      task.running   = false;
      task.startedAt = null;
      if (intervals[id]) { clearInterval(intervals[id]); delete intervals[id]; }
      saveTasks();
      renderTasks();
      updateRunningTaskDisplay();
    }

    function deleteTask(id) {
      stopTask(id);
      tasks = tasks.filter(t => t.id != id);
      if (selectedTaskIndex >= tasks.length) selectedTaskIndex = tasks.length - 1;
      saveTasks();
      renderTasks();
    }

    document.getElementById('add-task-btn').addEventListener('click', () => {
      tasks.push(newTaskData());
      selectedTaskIndex = tasks.length - 1;
      saveTasks();
      renderTasks();
      const inputs = document.querySelectorAll('.task-name');
      if (inputs.length) inputs[inputs.length - 1].focus();
    });

    /* ── Init ── */
    const runningIdx = tasks.findIndex(t => t.running);
    if (runningIdx !== -1) selectedTaskIndex = runningIdx;
    renderTasks();
    updateTotalTime();
    updateRunningTaskDisplay();
    setInterval(updateRunningTaskDisplay, 1000);
  </script>
</body>
</html>
